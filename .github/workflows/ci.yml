name: CI

# Lint + test gate. Runs on PRs to any branch and on pushes to main / dev.
# This is the only workflow in the repo and the required status check on main.
#
# There used to be a build.yml alongside it that rebuilt a Windows wheel on
# every push to main and republished it as a rolling "Development Build"
# pre-release. It was removed 2026-08-09: repo traffic showed no external
# consumers, so publishing wheels nobody downloaded was pure upkeep. Build
# locally with `maturin develop --release` (Python) or
# `cargo build --release --features c_abi` (native) — see CLAUDE.md.

on:
  push:
    branches: [main, dev]
  pull_request:

# Cancel any superseded run on the same ref so a fast-followup push doesn't
# leave the previous one chewing CPU.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: clippy + cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain (stable + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo target
        uses: Swatinem/rust-cache@v2

      # Mirror the local invariant: zero warnings.
      # Tests-and-examples are included so probe macros, doc tests, etc.
      # are also linted.
      #
      # Strict gate runs with both consumer features on simultaneously
      # — that's the maximum reachable surface (PyO3 wheel + extern "C"
      # bridges share the parsers underneath). The bare-default build is
      # a dev sub-surface (see the cfg_attr in src/lib.rs); a separate
      # `cargo check` keeps it compiling but skips the dead-code lint.
      - name: cargo check (default features, must compile)
        run: cargo check --lib
      - name: clippy --features c_abi,python (strict)
        run: cargo clippy --all-targets --lib --features c_abi,python -- -D warnings

      # The game-data-dependent tests skip cleanly when the install
      # paths (D:\..., G:\...) aren't present, so this exercises the
      # synthetic / pure-logic tests (PAZ compression, PABGH roundtrip,
      # trie, etc.) — exactly the layer that should be CI-verified.
      - name: cargo test --lib
        run: cargo test --lib
