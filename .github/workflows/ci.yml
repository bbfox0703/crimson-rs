name: CI

# Lint + test gate. Runs on PRs to any branch and on pushes to main / dev.
# This is the only workflow in the repo and the required status check on main.
#
# There used to be a build.yml alongside it that rebuilt a Windows wheel on
# every push to main and republished it as a rolling "Development Build"
# pre-release. It was removed 2026-08-09: repo traffic showed no external
# consumers, so publishing wheels nobody downloaded was pure upkeep. Build
# locally with `maturin develop --release` (Python) or
# `cargo build --release --features c_abi` (native) — see CLAUDE.md.

on:
  push:
    branches: [main, dev]
  pull_request:

# Cancel any superseded run on the same ref so a fast-followup push doesn't
# leave the previous one chewing CPU.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repository.
permissions:
  contents: read

jobs:
  lint-and-test:
    name: clippy + cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain (stable + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # PyO3's abi3-py312 needs a 3.12+ interpreter for every build with the
      # `python` feature; pinned rather than left to the runner image.
      - name: Install Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache cargo target
        uses: Swatinem/rust-cache@v2

      # Mirror the local invariant: zero warnings.
      # Tests-and-examples are included so probe macros, doc tests, etc.
      # are also linted.
      #
      # Strict gate runs with both consumer features on simultaneously
      # — that's the maximum reachable surface (PyO3 wheel + extern "C"
      # bridges share the parsers underneath). The bare-default build is
      # a dev sub-surface (see the cfg_attr in src/lib.rs); a separate
      # `cargo check` keeps it compiling but skips the dead-code lint.
      - name: cargo check (default features, must compile)
        run: cargo check --lib
      # Each consumer feature alone is what actually ships: `c_abi` builds the
      # native dll / lib, `python` the wheel. Neither is covered by the
      # combined clippy run below.
      - name: cargo check --features c_abi (the native build alone)
        run: cargo check --lib --features c_abi
      - name: cargo check --features python (the wheel build alone)
        run: cargo check --lib --features python
      - name: clippy --features c_abi,python (strict)
        run: cargo clippy --all-targets --lib --features c_abi,python -- -D warnings

      # `c_abi` on: every gamedata bridge and the save-editor ABI sit
      # behind it, so without it only 111 of the 399 tests compile in.
      # The game-data-dependent tests skip cleanly when the install,
      # the private fixtures and %LOCALAPPDATA% saves aren't present,
      # so this exercises the synthetic / pure-logic tests. The thread
      # cap mirrors the local invocation (see CLAUDE.md).
      - name: cargo test --lib --features c_abi
        run: cargo test --lib --features c_abi -- --test-threads=4

  # RustSec advisories against Cargo.lock. Not a required check: a new
  # advisory should be read, not block an unrelated push.
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        run: cargo audit

  # The shipped artifact: the MSVC release dll / lib, with the static CRT from
  # .cargo/config.toml. Fails if the dll imports anything beyond system DLLs
  # (a CRT DLL, python3.dll, or a native dependency). Not a required check.
  windows-native:
    name: windows native dll
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo target
        uses: Swatinem/rust-cache@v2

      - name: cargo build --release --features c_abi
        run: cargo build --release --lib --features c_abi

      - name: dll imports system DLLs only
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin not found' }
          $deps = & $dumpbin /nologo /dependents target\release\crimson_rs.dll |
            ForEach-Object { $_.Trim() } | Where-Object { $_ -match '\.dll$' -and $_ -notmatch '^Dump of file' }
          $deps | ForEach-Object { "  $_" }
          $allowed = '^(?i)(kernel32|ntdll|bcrypt|bcryptprimitives|advapi32|ws2_32|userenv|api-ms-win-core-[a-z0-9-]+)\.dll$'
          $bad = $deps | Where-Object { $_ -notmatch $allowed }
          if ($bad) { throw "crimson_rs.dll imports non-system DLLs: $($bad -join ', ')" }
          if (-not (Test-Path target\release\crimson_rs.lib)) { throw 'crimson_rs.lib (staticlib) missing' }
