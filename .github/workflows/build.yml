name: Build and Publish Wheels

on:
  push:
    branches: [main]
    # Skip the wheel rebuild/republish for documentation-only pushes — the
    # compiled wheel can't change when only markdown / docs assets move.
    # (ci.yml is intentionally NOT path-filtered: it's the required status
    # check on main, and a path-filtered required check would never report,
    # blocking docs PRs. The lint/test gate running on docs is cheap + safe.)
    # workflow_dispatch ignores paths-ignore, so manual republish still works.
    paths-ignore:
      - '**.md'
      - '**.MD'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual run'
        required: true
        default: 'Deploy wheels'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64-pc-windows-gnu
          args: --release --out dist
          sccache: true

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheel-windows-x64
          path: dist/*.whl

  release:
    needs: [build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Update develop release
        uses: ncipollo/release-action@v1
        with:
          # Tag tracks the in-game patch series this fork's parser targets.
          # Bump the minor when Pearl Abyss ships a new minor patch.
          tag: v1.0.10.x
          name: Development Build
          body: |
            Latest development wheels built from `main` (targets Crimson Desert 1.10.x).
            Updated on each push.
          artifacts: dist/*.whl
          allowUpdates: true
          removeArtifacts: true
          prerelease: true
          makeLatest: false
