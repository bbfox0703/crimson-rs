[package]
name = "crimson-rs"
version = "0.1.0"
edition = "2024"

[lib]
name = "crimson_rs"
crate-type = ["cdylib"]

[features]
# Additive C ABI for native consumers (Avalonia / C# / etc).
# When enabled, the cdylib exports a `crimson_save_*` extern "C"
# surface alongside the existing PyO3 entry point.
c_abi = []

[dependencies]
pyo3 = { version = "0.27.2", features = ["abi3-py312"] }
chacha20_crate = { package = "chacha20", version = "0.10.0" }
lz4_flex = "0.11"
flate2 = "1.0"
# Save file format needs HMAC-SHA256 for header authentication.
# RustCrypto family, same maintainers as chacha20.
hmac = "0.12"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
